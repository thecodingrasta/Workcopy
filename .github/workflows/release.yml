name: Draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing reviewed version tag, such as v0.1.0-rc.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      - name: Verify the existing tag and package
        env:
          VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: local
          GOFLAGS: -p=2
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse --verify --end-of-options "refs/tags/$VERSION^{commit}")" = "$GITHUB_SHA"
          go run ./tools/dev package "$VERSION"
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-downloads
          path: |
            dist/workcopy_*.zip
            dist/workcopy_*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: windows-latest
            target: windows_amd64
          - runner: windows-11-arm
            target: windows_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-latest
            target: darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-downloads
          path: downloads
      - name: Verify and exercise the extracted native executable
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extension = if ($env:TARGET.StartsWith('windows_')) { '.zip' } else { '.tar.gz' }
          $name = "workcopy_$($env:VERSION)_$($env:TARGET)$extension"
          $checksum = Get-Content downloads/SHA256SUMS | Where-Object { $_.EndsWith("  $name") }
          if (!$checksum -or (Get-FileHash "downloads/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum.Split(' ')[0]) { throw 'Checksum mismatch' }
          New-Item -ItemType Directory extracted | Out-Null
          tar -xf "downloads/$name" -C extracted
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          $binary = if ($env:TARGET.StartsWith('windows_')) { './extracted/workcopy.exe' } else { './extracted/workcopy' }
          $version = & $binary version --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $version.exitCode -ne 0 -or !$version.message.StartsWith("Workcopy $($env:VERSION) ($($env:TARGET.Replace('_','/')), ")) { throw 'Version or native architecture mismatch' }
          & $binary doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'Doctor failed' }
          & $binary help --json
          if ($LASTEXITCODE -ne 0) { throw 'Help failed' }
  draft:
    needs: [package, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-downloads
          path: dist
      - name: Create a draft, never publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --draft --generate-notes)
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION" dist/workcopy_*.zip dist/workcopy_*.tar.gz dist/SHA256SUMS "${flags[@]}"
